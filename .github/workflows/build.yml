name: Glacier.Showcase CI Pipeline

'on':
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-test-publish:
    name: Build, Test & Publish (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup NuGet sources
        shell: bash
        run: |
          if ! dotnet nuget list source | grep -q "github-packages"; then
            dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
              --name "github-packages" \
              --username "${{ github.repository_owner }}" \
              --password "${{ secrets.GITHUB_TOKEN }}" \
              --store-password-in-clear-text
          fi

      - name: Restore dependencies
        run: dotnet restore Glacier.Showcase.slnx

      - name: Build solution (Release)
        run: dotnet build Glacier.Showcase.slnx --configuration Release --no-restore

      - name: Run unit tests (Ubuntu - headless / hardware-free)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet test tests/Glacier.Showcase.Tests/Glacier.Showcase.Tests.csproj --configuration Release --no-build --filter "Category!=Hardware" --blame-hang --blame-hang-dump-type none --blame-hang-timeout 60s --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Run all tests (Windows)
        if: matrix.os == 'windows-latest'
        run: dotnet test tests/Glacier.Showcase.Tests/Glacier.Showcase.Tests.csproj --configuration Release --no-build --blame-hang --blame-hang-dump-type none --blame-hang-timeout 60s --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Publish Blazor application
        run: dotnet publish Glacier.Showcase.csproj --configuration Release --no-restore --output ./publish

      - name: Upload published showcase artifact
        if: matrix.os == 'ubuntu-latest' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@v4
        with:
          name: glacier-showcase-blazor-app
          path: ./publish
          retention-days: 7
