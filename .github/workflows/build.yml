name: .NET build and test
 
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup NuGet sources
        run: |
          dotnet nuget add source --name "github-packages" --username "${{ github.repository_owner }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" || true

      - name: Restore dependencies
        run: dotnet restore Glacier.Showcase.csproj

      - name: Build
        run: dotnet build Glacier.Showcase.csproj --configuration Release --no-restore

      - name: Run tests
        if: hashFiles('tests/**/*.csproj') != ''
        run: dotnet test tests/Glacier.Showcase.Tests/Glacier.Showcase.Tests.csproj --configuration Release --no-restore --no-build
